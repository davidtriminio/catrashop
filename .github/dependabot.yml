version: 2

# Automated dependency updates for every ecosystem in the repo. Security updates land as soon as an
# advisory is published; version updates are batched weekly to keep the PR volume manageable.
updates:
  - package-ecosystem: nuget
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      dotnet:
        patterns: ["*"]
    # Microsoft.AspNetCore.OpenApi 10.x requires Microsoft.OpenApi < 3.0.0 (NU1608 fails the build).
    # Microsoft.Extensions.* majors follow the .NET runtime: 11.x packages must not be mixed into a .NET 10 app,
    # so bump them by hand when the project moves to .NET 11.
    # Npgsql 11 depends on Microsoft.Extensions.* 11 (NU1605 package downgrade fails the build) and must move together
    # with Npgsql.EntityFrameworkCore.PostgreSQL, which is still on 10.x.
    ignore:
      - dependency-name: "Microsoft.OpenApi"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Npgsql"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Npgsql.EntityFrameworkCore.PostgreSQL"
        update-types: ["version-update:semver-major"]
    labels: ["dependencies", "backend"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*"]
      frontend-dev:
        dependency-type: development
    # TypeScript is pinned to what the Angular compiler supports (TypeScript 7 breaks `ng build`), and jsdom
    # majors follow Angular's test runner. Bump these by hand together with Angular.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jsdom"
        update-types: ["version-update:semver-major"]
    labels: ["dependencies", "frontend"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: ["dependencies", "ci"]
