version: 2

# Automated dependency updates for every ecosystem in the repo. Security updates land as soon as an
# advisory is published; version updates are batched weekly to keep the PR volume manageable.
updates:
  - package-ecosystem: nuget
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      dotnet:
        patterns: ["*"]
    # Microsoft.AspNetCore.OpenApi 10.x requires Microsoft.OpenApi < 3.0.0 (NU1608 fails the build).
    ignore:
      - dependency-name: "Microsoft.OpenApi"
        update-types: ["version-update:semver-major"]
    labels: ["dependencies", "backend"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*"]
      frontend-dev:
        dependency-type: development
    # TypeScript is pinned to what the Angular compiler supports (TypeScript 7 breaks `ng build`), and jsdom
    # majors follow Angular's test runner. Bump these by hand together with Angular.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jsdom"
        update-types: ["version-update:semver-major"]
    labels: ["dependencies", "frontend"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: ["dependencies", "ci"]
