# /etc/apache2/sites-available/catrashop-api.conf
# Cloudflare (proxied, SSL mode "Full (strict)") -> Apache :443 -> Kestrel 127.0.0.1:5080
# Needs: a2enmod proxy proxy_http ssl headers remoteip   (install.sh enables them)
<VirtualHost *:443>
    ServerName api.davidtriminio.dev

    SSLEngine on
    # Cloudflare Origin Certificate (dashboard > SSL/TLS > Origin Server), saved on the server
    SSLCertificateFile    /etc/ssl/cloudflare/davidtriminio.dev.pem
    SSLCertificateKeyFile /etc/ssl/cloudflare/davidtriminio.dev.key

    # Real client IP from Cloudflare (ranges refreshed by install.sh)
    RemoteIPHeader CF-Connecting-IP
    RemoteIPTrustedProxy /etc/apache2/cloudflare-ips.txt

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass        / http://127.0.0.1:5080/ timeout=60 keepalive=On
    ProxyPassReverse / http://127.0.0.1:5080/

    LimitRequestBody 2097152
    ErrorLog  ${APACHE_LOG_DIR}/catrashop-api-error.log
    CustomLog ${APACHE_LOG_DIR}/catrashop-api-access.log combined
</VirtualHost>
