# CommerceHub local infrastructure.
# Usage: copy .env.example to .env, then `docker compose up -d`.
# The API and frontend run on the host during development; this file provides their backing services.

name: commercehub

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-commercehub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-commercehub}
      POSTGRES_DB: ${POSTGRES_DB:-commercehub}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-commercehub} -d ${POSTGRES_DB:-commercehub}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-commercehub}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-commercehub}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"        # AMQP
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"  # Management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:-change_me_locally}
      N8N_PORT: 5678
      GENERIC_TIMEZONE: UTC
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
    ports:
      - "${N8N_PORT:-5678}:5678"
    volumes:
      - n8n-data:/home/node/.n8n
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # --- Observability stack (opt-in) -----------------------------------------------------------
  # Not started by default. Bring it up with:  docker compose --profile observability up -d
  # The API runs on the host, so it exports OTLP to Jaeger at localhost:4317 (set
  # Observability:OtlpEndpoint=http://localhost:4317), and Prometheus scrapes the host's /metrics.
  jaeger:
    image: jaegertracing/all-in-one:1.62
    profiles: ["observability"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"   # Jaeger UI
      - "${OTLP_GRPC_PORT:-4317}:4317"     # OTLP gRPC (traces/metrics/logs in)
      - "${OTLP_HTTP_PORT:-4318}:4318"     # OTLP HTTP
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: ["observability"]
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  n8n-data:
